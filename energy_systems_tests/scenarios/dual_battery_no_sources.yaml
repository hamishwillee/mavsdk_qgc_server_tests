name: dual_battery_no_sources
description: |
  Docs example "Dual Source/Battery System" with only the energy systems exposed
  (source requests NACKed).
  Expect: propulsion and avionics indicators; empty drop-downs.

behaviour:
  sources: unsupported

energy_systems:
  - index: 0
    flags: [PROPULSION]
    profile: {start: 95, end: 2, period: 4m}
    endurance: 25m
  - index: 1
    flags: [AVIONICS]
    profile: {start: 98, end: 60, period: 4m}
    endurance: 2h
